# CD (data): after CI passes on a push to main, publish the database and outputs as the
# rolling GitHub Release "data-latest", so the app, teammates and judges can download the
# exact data that passed CI without cloning or running anything.
name: CD - publish data

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-data-release
  cancel-in-progress: true

jobs:
  publish:
    name: Publish data-latest release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Refuse to publish a stale database
        run: python -m pipeline.db --check
      - name: Bundle
        run: |
          mkdir -p dist
          cp outputs/follow_the_rupee.db dist/
          cp docs/DATABASE.md dist/
          (cd outputs && zip -qr ../dist/outputs.zip . -x 'follow_the_rupee.db*' -x 'llm_cache/*')
          (cd outputs && zip -qr ../dist/llm_cache.zip llm_cache)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          python - <<'EOF' > dist/notes.md
          import json, os, sqlite3
          con = sqlite3.connect("outputs/follow_the_rupee.db")
          meta = {k: json.loads(v) for k, v in con.execute("SELECT key, value_json FROM meta")}
          counts = meta["row_counts"]
          print(f"Data that passed CI on `main` at {os.environ['SHA'][:7]}. All data is synthetic.\n")
          print(f"Database built {meta['built_at_utc']} UTC, schema v{meta['schema_version']}.\n")
          print("| Table | Rows |\n|---|---|")
          for k in ("complaints", "issues", "work_orders", "audit_flags", "open_issues", "budget_plan", "narratives"):
              print(f"| {k} | {counts[k]:,} |")
          print("\nAssets: `follow_the_rupee.db` (open with `pipeline.db` or any SQLite client), "
                "`DATABASE.md` (schema + example queries), `outputs.zip` (parquet/JSON/CSV), "
                "`llm_cache.zip` (cached Claude answers for offline runs), `SHA256SUMS.txt`.")
          EOF
      - name: Replace the data-latest release
        run: |
          gh release delete data-latest --yes --cleanup-tag || true
          gh release create data-latest \
            dist/follow_the_rupee.db dist/DATABASE.md dist/outputs.zip dist/llm_cache.zip dist/SHA256SUMS.txt \
            --target "$SHA" --title "Data: latest main (${SHA::7})" --notes-file dist/notes.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ env.SHA }}
          path: dist/
          retention-days: 30

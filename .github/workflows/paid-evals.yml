# Paid Claude evals, manual only. Needs the ANTHROPIC_API_KEY secret (repo or the
# "paid-evals" environment, which an admin can set to require a reviewer before it runs).
# The harness approval still applies: if the eval files changed since the hash committed
# in .claude/hillclimb/<suite>/_state.json, the run stops. A human approves locally with
# --approve-harness and commits _state.json.
name: Paid evals (manual)

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [extraction, narrative]
        default: extraction
      target:
        description: "app = the real app; claude = extraction ablation (every case through Claude)"
        type: choice
        options: [app, claude]
        default: app
      limit:
        description: "First N cases only (0 = all)"
        type: string
        default: "0"
      judge:
        description: "Narrative only: add the claude-sonnet-5-5 judge (extra cost)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paid-evals
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: paid-evals
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      SUITE: ${{ inputs.suite }}
      TARGET: ${{ inputs.target }}
      LIMIT: ${{ inputs.limit }}
      JUDGE: ${{ inputs.judge }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate inputs
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "::error::limit must be a whole number"; exit 1; }
          if [ "$TARGET" = "claude" ] && [ "$SUITE" != "extraction" ]; then
            echo "::error::target claude only applies to suite extraction"; exit 1; fi
          if [ "$JUDGE" = "true" ] && [ "$SUITE" != "narrative" ]; then
            echo "::error::judge only applies to suite narrative"; exit 1; fi
      - name: Run eval (new variant per run, so committed results are never touched)
        run: |
          args=(--suite "$SUITE" --target "$TARGET" --variant "v${GITHUB_RUN_NUMBER}" --limit "$LIMIT")
          [ "$JUDGE" = "true" ] && args+=(--judge)
          python -m evals.run_eval "${args[@]}" | tee eval.log
      - name: Job summary
        if: always()
        run: |
          { echo "## Paid eval: $SUITE / $TARGET (variant v${GITHUB_RUN_NUMBER})"; echo '```'
            sed -n '/scored,/,$p' eval.log 2>/dev/null || echo "no summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ inputs.suite }}-${{ inputs.target }}-v${{ github.run_number }}
          path: |
            .claude/hillclimb/${{ inputs.suite }}*/v${{ github.run_number }}/
            eval.log
          retention-days: 30

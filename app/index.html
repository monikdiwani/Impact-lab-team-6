<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Follow the Rupee: where Mumbai's monsoon road repair money went, whether the work held up, and where the next rupee should go. Synthetic data." />
    <title>Follow the Rupee</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='system-ui'>₹</text></svg>" />
    <script>
      // apply the saved or system theme before first paint, so there is no flash
      (function () {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "rupee-dark" : "rupee";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
